# Fly.io: see docs/self-hosting.md → Fly.io
#   fly launch --copy-config --config deploy/fly.toml --no-deploy   (pick an app name)
#   fly volumes create data --size 1
#   fly secrets set APP_SECRET=$(openssl rand -hex 32)
#   fly deploy --config deploy/fly.toml
app = "domain-brain"
primary_region = "ams"

[build]
  image = "ghcr.io/davidgarciab/domain-brain:latest"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine running: reminders and syncs run inside the app process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"
